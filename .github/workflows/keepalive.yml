name: Keep Supabase awake

# Supabase pauses a free project after a week without traffic, and a paused
# project fails every login and every passenger link until somebody restores
# it by hand. A carpool can go a week untouched (holidays, vacation), so the
# database gets one small read a day whether anyone opens the app or not.
#
# If the project is already paused this job fails, and GitHub emails about the
# failed run. That email is the alarm: restore the project from the Supabase
# dashboard, because a read cannot wake a paused project on its own.

on:
  schedule:
    # Daily at 09:17 UTC (06:17 in Brazil), off the hour because scheduled
    # runs at :00 are the ones GitHub delays most.
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # day_overrides is readable by anon by design, so the public key is
      # enough and no service_role key ever has to exist in this repository.
      - name: Read one row through the REST API
        env:
          URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          curl --fail-with-body -sS --retry 3 --retry-all-errors --max-time 30 \
            "$URL/rest/v1/day_overrides?select=day&limit=1" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY"

      # GitHub disables scheduled workflows on a repository with no activity
      # for 60 days, which would quietly stop the ping above. Enabling the
      # workflow through the API counts as activity and resets that clock.
      - name: Keep this schedule from being disabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
